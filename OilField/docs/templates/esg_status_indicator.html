<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESG Status Indicator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #e8eaf6 0%, #f3e5f5 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .page-title {
            font-size: 32px;
            font-weight: 600;
            color: #424242;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 36px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 600;
            color: #424242;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .header-icon {
            font-size: 32px;
        }

        .overall-score {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 28px;
            text-align: center;
        }

        .overall-label {
            font-size: 16px;
            color: #616161;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .overall-grade {
            font-size: 48px;
            font-weight: 700;
            color: #2e7d32;
            margin-bottom: 4px;
        }

        .overall-numeric {
            font-size: 18px;
            color: #616161;
            font-weight: 500;
        }

        .metric-section {
            margin-bottom: 32px;
        }

        .metric-section:last-child {
            margin-bottom: 0;
        }

        .metric-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .metric-title {
            font-size: 18px;
            font-weight: 500;
            color: #424242;
        }

        .metric-status {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-icon {
            font-size: 20px;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .badge-warning {
            background: #fff3e0;
            color: #e65100;
        }

        .badge-success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .badge-info {
            background: #e3f2fd;
            color: #1565c0;
        }

        .progress-bar-container {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .progress-bar {
            flex: 1;
            height: 32px;
            background: #f5f5f5;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            border-radius: 16px;
            position: relative;
            transition: width 0.6s ease;
        }

        .progress-pattern {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 40px;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 3px,
                rgba(0, 0, 0, 0.05) 3px,
                rgba(0, 0, 0, 0.05) 6px
            );
        }

        .progress-warning {
            background: linear-gradient(90deg, #fff3e0 0%, #ffb74d 100%);
        }

        .progress-success {
            background: linear-gradient(90deg, #c8e6c9 0%, #66bb6a 100%);
        }

        .progress-info {
            background: linear-gradient(90deg, #b3e5fc 0%, #4fc3f7 100%);
        }

        .progress-percentage {
            font-size: 20px;
            font-weight: 700;
            color: #424242;
            min-width: 60px;
            text-align: right;
        }

        @keyframes slideIn {
            from {
                width: 0;
            }
        }

        .progress-fill {
            animation: slideIn 0.8s ease-out;
        }

        @media (max-width: 640px) {
            .card {
                padding: 28px;
            }

            .page-title {
                font-size: 28px;
            }

            .overall-grade {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="page-title">8. ESG Status Indicator</h1>
        
        <div class="card">
            <div class="card-header">
                <span class="header-icon">🌍</span>
                ESG Score
            </div>

            <div class="overall-score">
                <div class="overall-label">Overall</div>
                <div class="overall-grade">B+</div>
                <div class="overall-numeric">(78/100)</div>
            </div>

            <div class="metric-section">
                <div class="metric-header">
                    <span class="metric-title">Carbon</span>
                    <div class="metric-status">
                        <span class="status-icon">⚠️</span>
                        <span class="status-badge badge-warning">Medium</span>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-fill progress-warning" style="width: 68%;">
                            <div class="progress-pattern"></div>
                        </div>
                    </div>
                    <div class="progress-percentage">68%</div>
                </div>
            </div>

            <div class="metric-section">
                <div class="metric-header">
                    <span class="metric-title">Compliance</span>
                    <div class="metric-status">
                        <span class="status-icon">✅</span>
                        <span class="status-badge badge-success">Verified</span>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-fill progress-success" style="width: 100%;">
                        </div>
                    </div>
                    <div class="progress-percentage">100%</div>
                </div>
            </div>

            <div class="metric-section">
                <div class="metric-header">
                    <span class="metric-title">Water Use</span>
                    <div class="metric-status">
                        <span class="status-icon">🟢</span>
                        <span class="status-badge badge-info">Low</span>
                    </div>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar">
                        <div class="progress-fill progress-info" style="width: 72%;">
                            <div class="progress-pattern"></div>
                        </div>
                    </div>
                    <div class="progress-percentage">72%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Animate progress bars on load
        window.addEventListener('load', function() {
            const progressBars = document.querySelectorAll('.progress-fill');
            progressBars.forEach(bar => {
                const width = bar.style.width;
                bar.style.width = '0';
                setTimeout(() => {
                    bar.style.width = width;
                }, 100);
            });
        });
    </script>
</body>
</html>
