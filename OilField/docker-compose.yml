services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: oilfield-postgres
    environment:
      POSTGRES_DB: oilfield
      POSTGRES_USER: oilfield
      POSTGRES_PASSWORD: oilfield_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oilfield -d oilfield"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oilfield-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: oilfield
      DB_USER: oilfield
      DB_PASSWORD: oilfield_dev
      DATABASE_URL: postgresql://oilfield:oilfield_dev@postgres:5432/oilfield
      CORS_ORIGIN: http://localhost:5173,http://localhost:8090
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: oilfield-frontend
    ports:
      - "8090:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
